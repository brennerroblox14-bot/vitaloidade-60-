<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cybercore Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --wallpaper-1: #dfefff;
        --wallpaper-2: #cfe8ff;
        --wallpaper-3: #b7dcff;
        --panel: rgba(255, 255, 255, 0.82);
        --panel-strong: rgba(255, 255, 255, 0.96);
        --line: rgba(50, 95, 176, 0.24);
        --text: #12314c;
        --muted: #58779b;
        --taskbar: linear-gradient(#eaf3ff, #d3e4ff 55%, #c0d9ff);
        --xp-blue: #3c74dd;
        --xp-blue-dark: #1f5fd1;
        --xp-green: #46c571;
        --white: #ffffff;
        --shadow: rgba(28, 70, 140, 0.15);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: linear-gradient(180deg, var(--wallpaper-1), var(--wallpaper-2), var(--wallpaper-3));
        color: var(--text);
        font-family: Tahoma, Verdana, Segoe UI, sans-serif;
        overflow: hidden;
      }

      body {
        min-height: 100vh;
      }

      .desktop {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background:
          linear-gradient(rgba(93, 168, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(93, 168, 255, 0.08) 1px, transparent 1px),
          radial-gradient(circle at 18% 12%, rgba(146, 202, 255, 0.38), transparent 20%),
          radial-gradient(circle at 82% 12%, rgba(136, 188, 255, 0.24), transparent 22%),
          linear-gradient(180deg, var(--wallpaper-1), var(--wallpaper-2) 30%, var(--wallpaper-3));
        background-size: 28px 28px, 28px 28px, 100% 100%, 100% 100%, 100% 100%;
      }

      .wallpaper-layer {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0;
        transition: opacity 0.25s ease;
      }

      .desktop.has-wallpaper .wallpaper-layer {
        opacity: 1;
      }

      .desktop::after {
        content: "CYBERCORE";
        position: absolute;
        right: 28px;
        top: 36px;
        font-size: 28px;
        letter-spacing: 0.64rem;
        color: rgba(41, 103, 195, 0.16);
        font-weight: 700;
        user-select: none;
      }

      .desktop-controls {
        position: absolute;
        right: 18px;
        top: 18px;
        display: flex;
        gap: 8px;
        z-index: 9;
      }

      .desktop-action {
        border: 1px solid rgba(40, 95, 170, 0.35);
        background: rgba(255, 255, 255, 0.76);
        color: var(--text);
        padding: 7px 10px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(23, 63, 128, 0.08);
      }

      .desktop-action.danger {
        color: #7d1c36;
      }

      .desktop-icons {
        position: absolute;
        left: 16px;
        top: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        z-index: 5;
      }

      .desktop-icon {
        width: 90px;
        text-align: center;
        color: var(--text);
        padding: 8px 6px;
        cursor: pointer;
        border: 1px solid transparent;
        position: relative;
      }

      .desktop-icon:hover {
        background: rgba(255,255,255,0.22);
        border-color: rgba(46, 116, 200, 0.18);
      }

      .desktop-icon .emoji {
        display: block;
        font-size: 28px;
        margin-bottom: 4px;
      }

      .desktop-icon .app-photo {
        width: 38px;
        height: 38px;
        margin: 0 auto 4px;
        border-radius: 8px;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: none;
        border: 1px solid rgba(42, 94, 163, 0.2);
        box-shadow: 0 6px 18px rgba(32, 82, 168, 0.15);
      }

      .desktop-icon.has-photo .emoji {
        display: none;
      }

      .desktop-icon.has-photo .app-photo {
        display: block;
      }

      .desktop-icon .name {
        display: block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08rem;
        text-transform: uppercase;
      }

      .icon-paste {
        position: absolute;
        right: -2px;
        top: -2px;
        width: 18px;
        height: 18px;
        border: 1px solid rgba(54, 107, 188, 0.24);
        background: rgba(255,255,255,0.9);
        color: var(--text);
        cursor: pointer;
        font-size: 10px;
        line-height: 1;
        padding: 0;
      }

      .window {
        position: absolute;
        left: 50%;
        top: 48%;
        transform: translate(-50%, -50%);
        width: min(760px, 80vw);
        background: var(--panel);
        border: 2px solid rgba(47, 101, 188, 0.52);
        box-shadow: 0 10px 24px rgba(14, 44, 82, 0.14), 0 0 0 1px rgba(255,255,255,0.55);
        display: none;
        z-index: 10;
      }

      .window.open {
        display: block;
      }

      .title-bar {
        height: 32px;
        background: linear-gradient(180deg, #4a9def, #1d67d5 58%, #1a5cc0);
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px 0 12px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08rem;
        text-transform: uppercase;
      }

      .window-actions {
        display: flex;
        gap: 4px;
      }

      .window-btn {
        width: 18px;
        height: 18px;
        border: 1px solid rgba(255,255,255,0.7);
        background: linear-gradient(180deg, #fdfefe, #dfe8ff);
        font-weight: 700;
        color: #0a1e47;
        cursor: pointer;
      }

      .window-body {
        padding: 14px;
        background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(235,244,255,0.62));
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 8px 4px 12px;
        border-bottom: 1px solid rgba(60, 108, 170, 0.28);
        margin-bottom: 12px;
      }

      .summary {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .pill {
        min-width: 120px;
        background: rgba(255,255,255,0.52);
        border: 1px solid rgba(40, 92, 162, 0.2);
        padding: 8px 10px;
        color: var(--text);
      }

      .pill span {
        display: block;
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.08rem;
        text-transform: uppercase;
      }

      .pill strong {
        display: block;
        margin-top: 4px;
        font-size: 20px;
        color: var(--xp-blue-dark);
      }

      .form-wrap {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr 0.9fr 0.9fr 1.1fr;
        gap: 10px;
        margin-bottom: 12px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
      }

      .field input {
        border: 1px solid rgba(51, 109, 191, 0.18);
        background: rgba(255,255,255,0.85);
        color: var(--text);
        padding: 8px 10px;
        font: inherit;
      }

      .actions-row {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-bottom: 12px;
      }

      .btn {
        border: 1px solid rgba(30, 94, 180, 0.22);
        background: linear-gradient(180deg, #edf6ff, #dae8ff);
        color: var(--text);
        font-weight: 700;
        padding: 8px 14px;
        cursor: pointer;
      }

      .btn.secondary {
        background: linear-gradient(180deg, #f4f8ff, #e2ebff);
      }

      .table-wrap {
        border: 1px solid rgba(63, 114, 210, 0.18);
        background: rgba(255,255,255,0.7);
        overflow: auto;
        max-height: 250px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      thead th {
        background: rgba(89, 162, 240, 0.08);
        color: var(--xp-blue-dark);
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.08rem;
        padding: 10px 8px;
        text-align: left;
        border-bottom: 1px solid rgba(60, 108, 170, 0.2);
      }

      tbody td {
        padding: 9px 8px;
        border-bottom: 1px solid rgba(60, 108, 170, 0.12);
        color: var(--text);
      }

      tbody tr:nth-child(even) {
        background: rgba(126, 171, 255, 0.04);
      }

      .cell-actions {
        display: flex;
        gap: 6px;
      }

      .mini-btn {
        border: 1px solid rgba(48, 100, 180, 0.18);
        background: rgba(255,255,255,0.9);
        color: var(--text);
        padding: 5px 8px;
        cursor: pointer;
      }

      .mini-btn.danger {
        color: #7c1d36;
      }

      .taskbar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 42px;
        background: var(--taskbar);
        border-top: 2px solid rgba(255,255,255,0.8);
        display: flex;
        align-items: center;
        z-index: 20;
      }

      .start-btn {
        height: 100%;
        min-width: 110px;
        border: 1px solid rgba(255,255,255,0.8);
        border-right: 2px solid rgba(30, 74, 133, 0.66);
        border-bottom: 2px solid rgba(30, 74, 133, 0.66);
        background: linear-gradient(180deg, #74d07b, #3abf62);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      .taskbar-right {
        margin-left: auto;
        height: 100%;
        min-width: 130px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-left: 1px solid rgba(28, 67, 136, 0.32);
        background: linear-gradient(180deg, #edf4ff, #cddcfb);
        color: var(--text);
        font-weight: 700;
      }

      @media (max-width: 800px) {
        .form-wrap { grid-template-columns: 1fr 1fr; }
      }

      @media (max-width: 560px) {
        .form-wrap { grid-template-columns: 1fr; }
        .window { width: min(92vw, 500px); }
        .desktop::after { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="desktop" id="desktopSurface">
      <div class="wallpaper-layer" id="wallpaperLayer"></div>

      <div class="desktop-controls">
        <button class="desktop-action" id="pasteWallpaperBtn" type="button">Colar imagem</button>
        <button class="desktop-action" id="downloadWallpaperBtn" type="button">Baixar imagem</button>
        <button class="desktop-action danger" id="removeWallpaperBtn" type="button">Excluir</button>
      </div>

      <input type="file" id="wallpaperInput" accept="image/*" hidden />

      <div class="desktop-icons">
        <div class="desktop-icon" data-window="chocolateWindow" data-app="chocolate">
          <button class="icon-paste" type="button" data-app="chocolate" aria-label="Colar imagem do app">📷</button>
          <span class="emoji">🍫</span>
          <span class="app-photo" aria-hidden="true"></span>
          <span class="name">Chocolate</span>
          <input type="file" accept="image/*" hidden data-app-file="chocolate" />
        </div>
        <div class="desktop-icon" data-window="breadWindow" data-app="bread">
          <button class="icon-paste" type="button" data-app="bread" aria-label="Colar imagem do app">📷</button>
          <span class="emoji">🥖</span>
          <span class="app-photo" aria-hidden="true"></span>
          <span class="name">Pão</span>
          <input type="file" accept="image/*" hidden data-app-file="bread" />
        </div>
      </div>

      <div class="window open" id="chocolateWindow">
        <div class="title-bar">
          <span>Chocolate / Vendas</span>
          <div class="window-actions">
            <button class="window-btn" data-close="chocolateWindow">×</button>
          </div>
        </div>
        <div class="window-body">
          <div class="toolbar">
            <div class="summary">
              <div class="pill">
                <span>Total</span>
                <strong id="chocolateTotal">R$ 0</strong>
              </div>
              <div class="pill">
                <span>Vendas</span>
                <strong id="chocolateCount">0</strong>
              </div>
            </div>
          </div>

          <form id="chocolateForm">
            <div class="form-wrap">
              <label class="field">
                Data e hora
                <input type="datetime-local" name="datetime" required />
              </label>
              <label class="field">
                Quantidade
                <input type="number" name="quantity" min="1" value="1" required />
              </label>
              <label class="field">
                Valor unitário
                <input type="number" name="price" min="0" step="0.01" value="14" required />
              </label>
              <label class="field">
                Caixa / nota
                <input type="text" name="note" placeholder="ex: caixa 1" />
              </label>
              <label class="field">
                Descrição
                <input type="text" name="description" placeholder="ex: entrega, pedido, mixer" />
              </label>
            </div>
            <div class="actions-row">
              <button type="submit" class="btn">Adicionar venda</button>
              <button type="button" class="btn secondary" id="cancelChocolate">Cancelar</button>
            </div>
          </form>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Data/Hora</th>
                  <th>Qtde</th>
                  <th>Valor</th>
                  <th>Nota</th>
                  <th>Descrição</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="chocolateTable"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="window" id="breadWindow">
        <div class="title-bar">
          <span>Pão / Vendas</span>
          <div class="window-actions">
            <button class="window-btn" data-close="breadWindow">×</button>
          </div>
        </div>
        <div class="window-body">
          <div class="toolbar">
            <div class="summary">
              <div class="pill">
                <span>Total</span>
                <strong id="breadTotal">R$ 0</strong>
              </div>
              <div class="pill">
                <span>Vendas</span>
                <strong id="breadCount">0</strong>
              </div>
            </div>
          </div>

          <form id="breadForm">
            <div class="form-wrap">
              <label class="field">
                Data e hora
                <input type="datetime-local" name="datetime" required />
              </label>
              <label class="field">
                Quantidade
                <input type="number" name="quantity" min="1" value="1" required />
              </label>
              <label class="field">
                Valor unitário
                <input type="number" name="price" min="0" step="0.01" value="8" required />
              </label>
              <label class="field">
                Caixa / nota
                <input type="text" name="note" placeholder="ex: loja 2" />
              </label>
              <label class="field">
                Descrição
                <input type="text" name="description" placeholder="ex: entrega, café, venda local" />
              </label>
            </div>
            <div class="actions-row">
              <button type="submit" class="btn">Adicionar venda</button>
              <button type="button" class="btn secondary" id="cancelBread">Cancelar</button>
            </div>
          </form>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Data/Hora</th>
                  <th>Qtde</th>
                  <th>Valor</th>
                  <th>Nota</th>
                  <th>Descrição</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="breadTable"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="taskbar">
        <button class="start-btn">Iniciar</button>
        <div class="taskbar-right" id="clock">--:--</div>
      </div>
    </div>

    <script>
      const appData = {
        chocolate: [
          { id: 1, datetime: '2026-11-06T08:20', quantity: 12, price: 14, note: 'caixa 1', description: 'entrega matinal' },
          { id: 2, datetime: '2026-11-06T10:45', quantity: 8, price: 14, note: 'mixer', description: 'pedido especial' }
        ],
        bread: [
          { id: 3, datetime: '2026-11-06T09:00', quantity: 18, price: 8, note: 'loja 2', description: 'venda local' },
          { id: 4, datetime: '2026-11-06T11:25', quantity: 14, price: 8, note: 'balcão', description: 'café e entrega' }
        ]
      };

      const editing = { chocolate: null, bread: null };

      function money(value) {
        return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
      }

      function formatDate(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return '-';
        return new Intl.DateTimeFormat('pt-BR', {
          day: '2-digit', month: '2-digit', year: 'numeric',
          hour: '2-digit', minute: '2-digit'
        }).format(date);
      }

      function renderTable(appName) {
        const items = [...appData[appName]].sort((a, b) => new Date(b.datetime) - new Date(a.datetime));
        const body = document.getElementById(`${appName}Table`);
        const total = items.reduce((sum, item) => sum + item.quantity * item.price, 0);
        const totalEl = document.getElementById(`${appName}Total`);
        const countEl = document.getElementById(`${appName}Count`);

        totalEl.textContent = money(total);
        countEl.textContent = String(items.length);

        if (!items.length) {
          body.innerHTML = '<tr><td colspan="6" style="padding:18px;color:#547196;">Nenhuma venda registrada.</td></tr>';
          return;
        }

        body.innerHTML = items.map((item) => `
          <tr>
            <td>${formatDate(item.datetime)}</td>
            <td>${item.quantity}</td>
            <td>${money(item.quantity * item.price)}</td>
            <td>${item.note || '-'}</td>
            <td>${item.description || '-'}</td>
            <td>
              <div class="cell-actions">
                <button class="mini-btn" data-action="edit" data-app="${appName}" data-id="${item.id}">Editar</button>
                <button class="mini-btn danger" data-action="delete" data-app="${appName}" data-id="${item.id}">Excluir</button>
              </div>
            </td>
          </tr>
        `).join('');
      }

      function resetForm(appName) {
        const form = document.getElementById(`${appName}Form`);
        form.reset();
        form.querySelector('input[name="datetime"]').value = '';
        form.querySelector('input[name="quantity"]').value = 1;
        form.querySelector('input[name="price"]').value = appName === 'chocolate' ? 14 : 8;
        editing[appName] = null;
        form.querySelector('button[type="submit"]').textContent = 'Adicionar venda';
      }

      function bindForm(appName) {
        const form = document.getElementById(`${appName}Form`);

        form.addEventListener('submit', (event) => {
          event.preventDefault();
          const formData = new FormData(form);
          const payload = {
            datetime: formData.get('datetime'),
            quantity: Number(formData.get('quantity')),
            price: Number(formData.get('price')),
            note: String(formData.get('note') || '').trim(),
            description: String(formData.get('description') || '').trim()
          };

          if (!payload.datetime || payload.quantity <= 0 || payload.price <= 0) return;

          if (editing[appName]) {
            const target = appData[appName].find((item) => item.id === editing[appName]);
            if (target) {
              target.datetime = payload.datetime;
              target.quantity = payload.quantity;
              target.price = payload.price;
              target.note = payload.note;
              target.description = payload.description;
            }
          } else {
            appData[appName].push({
              id: Date.now() + Math.random(),
              datetime: payload.datetime,
              quantity: payload.quantity,
              price: payload.price,
              note: payload.note,
              description: payload.description
            });
          }

          renderTable(appName);
          resetForm(appName);
        });
      }

      function bindButtons(appName) {
        const table = document.getElementById(`${appName}Table`);
        table.addEventListener('click', (event) => {
          const button = event.target.closest('button');
          if (!button) return;

          const app = button.dataset.app;
          const id = Number(button.dataset.id);
          const action = button.dataset.action;

          if (action === 'edit') {
            const target = appData[app].find((item) => item.id === id);
            if (!target) return;

            const form = document.getElementById(`${app}Form`);
            form.querySelector('input[name="datetime"]').value = target.datetime;
            form.querySelector('input[name="quantity"]').value = target.quantity;
            form.querySelector('input[name="price"]').value = target.price;
            form.querySelector('input[name="note"]').value = target.note || '';
            form.querySelector('input[name="description"]').value = target.description || '';
            editing[app] = target.id;
            form.querySelector('button[type="submit"]').textContent = 'Salvar edição';
          }

          if (action === 'delete') {
            appData[app] = appData[app].filter((item) => item.id !== id);
            renderTable(app);
            if (editing[app] === id) resetForm(app);
          }
        });
      }

      document.querySelectorAll('.desktop-icon').forEach((icon) => {
        icon.addEventListener('click', () => {
          const target = icon.dataset.window;
          document.querySelectorAll('.window').forEach((win) => {
            win.classList.toggle('open', win.id === target);
          });
        });
      });

      document.querySelectorAll('[data-close]').forEach((button) => {
        button.addEventListener('click', () => {
          const target = button.dataset.close;
          const win = document.getElementById(target);
          if (win) win.classList.remove('open');
        });
      });

      document.getElementById('cancelChocolate').addEventListener('click', () => resetForm('chocolate'));
      document.getElementById('cancelBread').addEventListener('click', () => resetForm('bread'));

      let wallpaperDataUrl = '';

      function applyWallpaper(dataUrl) {
        wallpaperDataUrl = dataUrl || '';
        const layer = document.getElementById('wallpaperLayer');
        const desktop = document.getElementById('desktopSurface');

        if (!wallpaperDataUrl) {
          layer.style.backgroundImage = '';
          desktop.classList.remove('has-wallpaper');
          return;
        }

        layer.style.backgroundImage = `url("${wallpaperDataUrl}")`;
        desktop.classList.add('has-wallpaper');
      }

      function readImageFile(file) {
        if (!file || !file.type.startsWith('image/')) return;

        const reader = new FileReader();
        reader.onload = (event) => applyWallpaper(event.target.result);
        reader.readAsDataURL(file);
      }

      function downloadWallpaper() {
        const canvas = document.createElement('canvas');
        canvas.width = 1600;
        canvas.height = 900;
        const ctx = canvas.getContext('2d');

        const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        gradient.addColorStop(0, '#dfefff');
        gradient.addColorStop(0.4, '#cfe8ff');
        gradient.addColorStop(1, '#b7dcff');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(94, 162, 255, 0.12)';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 26) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 26) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }

        if (wallpaperDataUrl) {
          const img = new Image();
          img.onload = () => {
            ctx.save();
            ctx.globalAlpha = 0.92;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            ctx.restore();
            const link = document.createElement('a');
            link.download = 'cybercore-wallpaper.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
          };
          img.src = wallpaperDataUrl;
          return;
        }

        ctx.fillStyle = 'rgba(41, 103, 195, 0.18)';
        ctx.font = '700 54px Segoe UI';
        ctx.fillText('CYBERCORE', canvas.width - 540, 120);

        const link = document.createElement('a');
        link.download = 'cybercore-wallpaper.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }

      document.addEventListener('paste', (event) => {
        const file = event.clipboardData && event.clipboardData.files && event.clipboardData.files[0];
        if (file) {
          event.preventDefault();
          readImageFile(file);
        }
      });

      document.getElementById('pasteWallpaperBtn').addEventListener('click', () => {
        document.getElementById('wallpaperInput').click();
      });

      document.getElementById('wallpaperInput').addEventListener('change', (event) => {
        const file = event.target.files && event.target.files[0];
        readImageFile(file);
      });

      document.getElementById('downloadWallpaperBtn').addEventListener('click', downloadWallpaper);
      document.getElementById('removeWallpaperBtn').addEventListener('click', () => applyWallpaper(''));

      const appIcons = { chocolate: '', bread: '' };

      function renderAppIcons() {
        document.querySelectorAll('.desktop-icon').forEach((icon) => {
          const appName = icon.dataset.app;
          const photo = icon.querySelector('.app-photo');
          const hasImage = Boolean(appIcons[appName]);
          icon.classList.toggle('has-photo', hasImage);
          if (photo) {
            photo.style.backgroundImage = hasImage ? `url("${appIcons[appName]}")` : 'none';
          }
        });
      }

      function setAppIcon(appName, dataUrl) {
        appIcons[appName] = dataUrl || '';
        renderAppIcons();
      }

      function readAppImage(file, appName) {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (event) => setAppIcon(appName, event.target.result);
        reader.readAsDataURL(file);
      }

      function bindAppIconControls() {
        document.querySelectorAll('.icon-paste').forEach((button) => {
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            const appName = button.dataset.app;
            const input = document.querySelector(`[data-app-file="${appName}"]`);
            if (input) input.click();
          });
        });

        document.querySelectorAll('[data-app-file]').forEach((input) => {
          input.addEventListener('change', (event) => {
            const appName = event.target.dataset.appFile;
            const file = event.target.files && event.target.files[0];
            readAppImage(file, appName);
            event.target.value = '';
          });
        });

        document.querySelectorAll('.desktop-icon').forEach((icon) => {
          icon.addEventListener('paste', (event) => {
            const file = event.clipboardData && event.clipboardData.files && event.clipboardData.files[0];
            if (file) {
              event.preventDefault();
              const appName = icon.dataset.app;
              readAppImage(file, appName);
            }
          });
        });
      }

      function updateClock() {
        const now = new Date();
        document.getElementById('clock').textContent = now.toLocaleTimeString('pt-BR', {
          hour: '2-digit', minute: '2-digit'
        });
      }

      bindForm('chocolate');
      bindForm('bread');
      bindButtons('chocolate');
      bindButtons('bread');
      bindAppIconControls();
      renderAppIcons();
      renderTable('chocolate');
      renderTable('bread');
      updateClock();
      setInterval(updateClock, 30000);
    </script>
  </body>
</html>
